name: Update contribution snake

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Generate snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%2306b6d4&color_dots=%23ebedf0,%23bae6fd,%237dd3fc,%2306b6d4,%230e7490
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%2306b6d4&color_dots=%230d1117,%231e3a8a,%231d4ed8,%2306b6d4,%2367e8f9

      - name: Publish animation to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

